<svg width="640" height="160" viewBox="0 0 640 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- App icon (diamond-D on brass) -->
  <g transform="translate(48, 80)">
    <!-- Rounded square 80x80 (scaled from 512) -->
    <rect x="0" y="0" width="80" height="80" rx="15" fill="#C6A15B"/>
    <g transform="translate(40, 40)">
      <!-- D monogram stem -->
      <path d="M-20 -40 V40" stroke="#0F100E" stroke-width="8" stroke-linecap="square"/>
      <path d="M-20 -40 C-7 -40 4 -24 4 -8 C4 8 -7 40 -20 40" stroke="#0F100E" stroke-width="8" fill="none" stroke-linecap="round"/>
      <!-- Diamond needle in counter -->
      <polygon points="0,-20 20,0 0,20 -20,0" fill="#0F100E"/>
      <polygon points="0,-7 7,0 0,7 -7,0" fill="#C6A15B"/>
    </g>
  </g>

  <!-- "DevPilot AI" serif wordmark (vector outlines) -->
  <g transform="translate(160, 80)">
    <!-- D (Didone serif) -->
    <g transform="translate(0, 0)">
      <path d="M0 -56 V56" fill="#0F100E"/>
      <path d="M0 -56 C18 -56 28 -42 28 -24 C28 -6 18 8 0 8 C0 20 -6 32 -12 40" fill="#0F100E"/>
      <path d="M0 -56 C18 -56 28 -42 28 -24 C28 -6 18 8 0 8 C0 20 -6 32 -12 40" fill="#C6A15B" transform="scale(0.85, 0.85) translate(-2, -1)" fill-opacity="0.5"/> <!-- counter -->
      <rect x="-24" y="-56" width="4" height="4" fill="#0F100E"/>
      <rect x="-24" y="52" width="4" height="4" fill="#0F100E"/>
    </g>

    <!-- e -->
    <g transform="translate(48, 0)">
      <path d="M0 -40 C12 -40 20 -30 20 -18 C20 -6 12 4 0 4 C-12 4 -20 -6 -20 -18 C-20 -30 -12 -40 0 -40" fill="#0F100E"/>
      <path d="M0 -30 C8 -30 12 -24 12 -18 C12 -12 8 -6 0 -6 C-8 -6 -12 -12 -12 -18 C-12 -24 -8 -30 0 -30" fill="#C6A15B"/>
      <rect x="18" y="-42" width="4" height="4" fill="#0F100E"/>
    </g>

    <!-- v -->
    <g transform="translate(92, 0)">
      <path d="M-12 0 L-3 -24" stroke="#0F100E" stroke-width="4" stroke-linecap="square" fill="none"/>
      <path d="M3 -24 L12 0" stroke="#0F100E" stroke-width="10" stroke-linecap="square" fill="none"/>
      <rect x="-14" y="0" width="4" height="4" fill="#0F100E"/>
      <rect x="10" y="0" width="4" height="4" fill="#0F100E"/>
    </g>

    <!-- P -->
    <g transform="translate(132, 0)">
      <path d="M4 -48 V4" stroke="#0F100E" stroke-width="10" stroke-linecap="square" fill="none"/>
      <path d="M-4 -48 H4" stroke="#0F100E" stroke-width="4" stroke-linecap="square" fill="none"/>
      <path d="M4 -48 C14 -48 20 -38 20 -28 C20 -18 14 -8 4 -8 C4 -2 -4 0 -8 4" stroke="#0F100E" stroke-width="10" fill="none" stroke-linecap="round"/>
      <rect x="-6" y="4" width="4" height="4" fill="#0F100E"/>
    </g>

    <!-- i -->
    <g transform="translate(160, 0)">
      <rect x="-2" y="-40" width="4" height="40" fill="#0F100E"/>
      <rect x="-6" y="-46" width="12" height="4" fill="#0F100E"/>
      <rect x="-6" y="4" width="12" height="4" fill="#0F100E"/>
      <ellipse cx="0" cy="-50" rx="3" ry="4" fill="#0F100E"/>
    </g>

    <!-- l -->
    <g transform="translate(184, 0)">
      <rect x="-2" y="-56" width="4" height="56" fill="#0F100E"/>
      <rect x="-6" y="-62" width="12" height="4" fill="#0F100E"/>
      <rect x="-6" y="4" width="12" height="4" fill="#0F100E"/>
      <ellipse cx="0" cy="-62" rx="3" ry="3" fill="#0F100E"/>
    </g>

    <!-- o -->
    <g transform="translate(212, 0)">
      <path d="M0 -30 C10 -30 16 -22 16 -14 C16 -6 10 2 0 2 C-10 2 -16 -6 -16 -14 C-16 -22 -10 -30 0 -30" fill="#0F100E"/>
      <path d="M0 -24 C6 -24 10 -18 10 -14 C10 -10 6 -4 0 -4 C-6 -4 -10 -10 -10 -14 C-10 -18 -6 -24 0 -24" fill="#C6A15B"/>
    </g>

    <!-- t -->
    <g transform="translate(248, 0)">
      <rect x="-16" y="-50" width="32" height="4" fill="#0F100E"/>
      <rect x="-2" y="-56" width="4" height="48" fill="#0F100E"/>
      <rect x="-6" y="4" width="12" height="4" fill="#0F100E"/>
    </g>

    <!-- AI (small caps) -->
    <g transform="translate(296, 0)">
      <!-- A -->
      <path d="M-8 -40 L-8 0" stroke="#0F100E" stroke-width="5" stroke-linecap="square" fill="none"/>
      <path d="M8 -40 L8 0" stroke="#0F100E" stroke-width="5" stroke-linecap="square" fill="none"/>
      <path d="M-8 -20 L8 -20" stroke="#0F100E" stroke-width="4" stroke-linecap="square" fill="none"/>
      <path d="M-10 0 L-6 0" stroke="#0F100E" stroke-width="2" stroke-linecap="square" fill="none"/>
      <path d="M6 0 L10 0" stroke="#0F100E" stroke-width="2" stroke-linecap="square" fill="none"/>
      <!-- I -->
      <path d="M24 -40 L24 0" stroke="#0F100E" stroke-width="5" stroke-linecap="square" fill="none"/>
      <path d="M20 -40 L28 -40" stroke="#0F100E" stroke-width="2" stroke-linecap="square" fill="none"/>
      <path d="M20 0 L28 0" stroke="#0F100E" stroke-width="2" stroke-linecap="square" fill="none"/>
    </g>
  </g>
</svg>