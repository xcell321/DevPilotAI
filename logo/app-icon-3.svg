<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- App Icon 3: D monogram with diamond needle on brass -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="#C6A15B"/>
  <g transform="translate(256, 256)">
    <!-- D monogram: vertical stem + counter + diamond needle integrated -->
    <path d="M-120 -144 V144" stroke="#0F100E" stroke-width="48" stroke-linecap="square"/>
    <path d="M-120 -144 C-40 -144 20 -96 20 -16 C20 64 -40 144 -120 144" stroke="#0F100E" stroke-width="48" fill="none" stroke-linecap="round"/>
    <!-- Diamond needle integrated into the counter of D -->
    <polygon points="0,-72 72,0 0,72 -72,0" fill="#0F100E"/>
    <polygon points="0,-24 24,0 0,24 -24,0" fill="#C6A15B"/>
  </g>
</svg>