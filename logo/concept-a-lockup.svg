<svg width="512" height="160" viewBox="0 0 512 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Concept A Lockup: DevPilot wordmark + "AI" small caps -->
  <!-- Wordmark from concept-a, then "AI" in small caps monospace at x=384 -->

  <!-- DevPilot (same as concept-a) -->
  <g transform="translate(0, 0)">
    <!-- D -->
    <g transform="translate(32, 100)">
      <path d="M-20 0 V-80" stroke="black" stroke-width="8" stroke-linecap="square"/>
      <path d="M-26 -80 H-14" stroke="black" stroke-width="3" stroke-linecap="square"/>
      <path d="M-26 0 H-14" stroke="black" stroke-width="3" stroke-linecap="square"/>
      <path d="M-12 -80 C12 -80 24 -60 24 -40 C24 -20 12 0 -12 0" stroke="black" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M-12 0 H-4" stroke="black" stroke-width="3" stroke-linecap="square"/>
    </g>
    <!-- e -->
    <g transform="translate(96, 100)">
      <path d="M-16 -24 H16" stroke="black" stroke-width="6" stroke-linecap="square"/>
      <path d="M0 -48 C16 -48 24 -36 24 -24 C24 -12 16 0 0 0 C-16 0 -24 -12 -24 -24 C-24 -36 -16 -48 0 -48" stroke="black" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M16 -24 H20" stroke="black" stroke-width="3" stroke-linecap="square"/>
    </g>
    <!-- v (shared with P) -->
    <g transform="translate(136, 100)">
      <path d="M-16 0 L-4 -32" stroke="black" stroke-width="4" stroke-linecap="square"/>
      <path d="M4 -32 L16 0" stroke="black" stroke-width="8" stroke-linecap="square"/>
      <path d="M-19 0 H-13" stroke="black" stroke-width="3" stroke-linecap="square"/>
      <path d="M13 0 H19" stroke="black" stroke-width="3" stroke-linecap="square"/>
      <path d="M4 -32 V-80" stroke="black" stroke-width="8" stroke-linecap="square"/>
      <path d="M-2 -80 H10" stroke="black" stroke-width="3" stroke-linecap="square"/>
    </g>
    <!-- P -->
    <g transform="translate(184, 100)">
      <path d="M4 -80 C20 -80 28 -64 28 -48 C28 -32 20 -20 4 -20 C4 -12 -4 -6 -4 0" stroke="black" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M-4 0 H4" stroke="black" stroke-width="3" stroke-linecap="square"/>
    </g>
    <!-- i -->
    <g transform="translate(220, 100)">
      <path d="M0 0 V-48" stroke="black" stroke-width="4" stroke-linecap="square"/>
      <path d="M-6 -48 H6" stroke="black" stroke-width="3" stroke-linecap="square"/>
      <path d="M-6 0 H6" stroke="black" stroke-width="3" stroke-linecap="square"/>
      <polygon points="0,-60 3,-57 0,-54 -3,-57" fill="black"/>
    </g>
    <!-- l -->
    <g transform="translate(244, 100)">
      <path d="M0 0 V-80" stroke="black" stroke-width="4" stroke-linecap="square"/>
      <path d="M-6 -80 H6" stroke="black" stroke-width="3" stroke-linecap="square"/>
      <path d="M-6 0 H6" stroke="black" stroke-width="3" stroke-linecap="square"/>
    </g>
    <!-- o -->
    <g transform="translate(280, 100)">
      <path d="M0 -48 C16 -48 24 -36 24 -24 C24 -12 16 0 0 0 C-16 0 -24 -12 -24 -24 C-24 -36 -16 -48 0 -48" stroke="black" stroke-width="6" fill="none" stroke-linecap="round"/>
    </g>
    <!-- t -->
    <g transform="translate(328, 100)">
      <path d="M-20 -72 H20" stroke="black" stroke-width="5" stroke-linecap="square"/>
      <path d="M0 -48 V0" stroke="black" stroke-width="4" stroke-linecap="square"/>
      <path d="M-6 -80 H6" stroke="black" stroke-width="3" stroke-linecap="square"/>
      <path d="M-6 0 H6" stroke="black" stroke-width="3" stroke-linecap="square"/>
    </g>
  </g>

  <!-- AI small caps monospace at x=384 -->
  <g transform="translate(400, 100)">
    <!-- A (small cap, cap height 48) -->
    <path d="M-12 0 V-48" stroke="black" stroke-width="5" stroke-linecap="square"/>
    <path d="M12 0 V-48" stroke="black" stroke-width="5" stroke-linecap="square"/>
    <path d="M-12 -24 H12" stroke="black" stroke-width="4" stroke-linecap="square"/>
    <path d="M-15 0 H-9" stroke="black" stroke-width="2" stroke-linecap="square"/>
    <path d="M9 0 H15" stroke="black" stroke-width="2" stroke-linecap="square"/>
    <!-- I -->
    <path d="M32 0 V-48" stroke="black" stroke-width="5" stroke-linecap="square"/>
    <path d="M26 -48 H38" stroke="black" stroke-width="2" stroke-linecap="square"/>
    <path d="M26 0 H38" stroke="black" stroke-width="2" stroke-linecap="square"/>
